- title: Academic Interests
  type: nested_list
  contents:
    - title: AI Infrastructure and Systems for ML
      items:
        - LLM and MoE serving on heterogeneous CPU–GPU platforms, including NVIDIA Superchips and MIG-partitioned GPUs.
        - Hierarchical memory systems, zero-copy KV-cache offloading, and interconnect-aware runtimes.
    - title: Cloud-Native Microservices and Serverless Platforms
      items:
        - QoS-aware, scalable resource management for large-scale microservice and serverless workloads in production data centers.
        - Workload prediction, autoscaling, and performance isolation under dynamic and bursty traffic.
    - title: RDMA- and DSM-Based Systems
      items:
        - RDMA-based distributed shared memory (DSM) as shared infrastructure for fine-grained, latency-sensitive pipelines.
        - Cross-node and cross-GPU memory systems using GPU-direct RDMA and global address space abstractions.

